version: 2
updates:
  # ── npm / pnpm ───────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # ACH-006 supply-chain-dependencias: grupo major separado para forçar
      # review humano em bumps que podem ter breaking changes.
      major-updates:
        update-types: [major]
    reviewers:
      - WeaveCode-UK/owners

  # ── Docker (Dockerfiles em /deploy/) ─────────────────────────
  # ACH-006 supply-chain-dependencias: cobre base images dos serviços web/worker.
  # Dependabot atualiza tag + @sha256 digest (ACH-004).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    reviewers:
      - WeaveCode-UK/owners

  # ── docker-compose (compose files na raiz) ────────────────────
  # ACH-006 supply-chain-dependencias: cobre postgres, redis, nginx, prometheus,
  # alertmanager, grafana, certbot em docker-compose.prod.yml / .yml / .staging.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]
    reviewers:
      - WeaveCode-UK/owners

  # ── GitHub Actions (workflows) ───────────────────────────────
  # ACH-006 supply-chain-dependencias: mantém pinned actions (actions/*, pnpm,
  # gitleaks, etc.) em dia. Bump de major vira PR separado.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    reviewers:
      - WeaveCode-UK/owners
