# ACH-001: Reproducible image builds in CI — pushes tagged images to GHCR
# with SBOM + vulnerability scan. Manual docker build on the VM becomes the
# fallback, not the primary path.
#
# Trigger matrix:
#  - pushes to main          → tags `sha-<short>` + `main`
#  - semver tags (`v1.2.3`)  → tags `v1.2.3`, `1.2`, `1`, `latest`
#  - workflow_dispatch       → ad-hoc re-build
#
# Requires GITHUB_TOKEN with packages:write (default in repo settings).
name: Docker Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # ACH-005 supply-chain-dependencias: id-token é necessário para cosign
  # keyless signing (OIDC) e para actions/attest-build-provenance (SLSA).
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/wbc

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        component: [web, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ACH-015: DATABASE_URL via build-secret (never cached in layer).
          # Configure the repo secret BUILD_DATABASE_URL or leave empty for
          # builds that don't need a real DB (prisma can use a placeholder).
          secrets: |
            database_url=${{ secrets.BUILD_DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ACH-059 seguranca: Trivy now BLOCKS merge on CRITICAL/HIGH
      # findings (exit-code: 1). The SARIF upload still runs via the
      # subsequent step's `if: always()` so reviewers see the rich diff
      # even when the gate fails. Use `ignore-unfixed: true` so a
      # vulnerability without an upstream fix doesn't lock the pipeline
      # forever — those still surface in the SARIF and need a triage
      # decision per ACH-062.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 30

      # ACH-005 supply-chain-dependencias: cosign keyless signing via OIDC.
      # Assinatura pública fica em Rekor (sigstore transparency log).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.0

      - name: Sign container image (keyless, Rekor)
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      # ACH-005 supply-chain-dependencias: SLSA build provenance attestation.
      # Prova que este digest foi construído por este workflow neste commit.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ACH-005 supply-chain-dependencias: attestation do SBOM — liga o
      # SBOM gerado ao digest da imagem, verificável via `cosign verify-attestation`.
      - name: Attach SBOM as attestation
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.component }}.cdx.json
          push-to-registry: true
