# Post-audit ACH-002 supply-chain-dependencias: o projeto usa `next-auth@5.0.0-beta.30`
# em produção. Este workflow roda semanalmente e abre uma issue quando:
#   (a) o npm publica uma nova beta OU
#   (b) sai a primeira versão estável (não-beta) da major 5.
# Isso força revisão humana (docs/AUTH-NEXTAUTH-BETA.md tem o checklist de bump).
name: Next-Auth Watch

on:
  schedule:
    - cron: "0 9 * * 1" # toda segunda 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query npm for latest next-auth
        id: npm
        run: |
          latest=$(curl -fsSL https://registry.npmjs.org/next-auth/latest | jq -r .version)
          current=$(jq -r '.dependencies["next-auth"] // empty' apps/web/package.json)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi
          # GA detection: latest sem "-beta"/"-alpha"/"-rc" e major == 5
          case "$latest" in
            *-beta*|*-alpha*|*-rc*) echo "is_ga=false" >> "$GITHUB_OUTPUT" ;;
            5.*)                    echo "is_ga=true"  >> "$GITHUB_OUTPUT" ;;
            *)                      echo "is_ga=other" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Open issue if update available
        if: steps.npm.outputs.has_update == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { latest, current, is_ga } = ${{ toJSON(steps.npm.outputs) }};
            const gaBadge = is_ga === 'true' ? '🎉 **GA detected**' : 'new release (still beta/rc)';
            const title = `next-auth update available: ${current} → ${latest} (${gaBadge})`;
            const body = [
              `Tracked by Next-Auth Watch (ACH-002 supply-chain-dependencias).`,
              ``,
              `- **Current:** \`${current}\``,
              `- **Latest npm:** \`${latest}\``,
              `- **GA flag:** \`${is_ga}\``,
              ``,
              `Checklist antes de bumpar: [\`docs/AUTH-NEXTAUTH-BETA.md\`](../blob/main/docs/AUTH-NEXTAUTH-BETA.md).`,
              ``,
              `CODEOWNERS em \`.github/CODEOWNERS\` cobre os arquivos de auth; qualquer PR bumpando \`next-auth\` requer review.`,
            ].join('\n');

            // evita duplicar — procura issue aberta com mesmo título exato
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'next-auth-watch',
              per_page: 50,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Issue já existente — nada a fazer.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['next-auth-watch', 'dependencies'],
            });
