<!doctype html>
<html><head><meta charset="utf-8"><title>App Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--wc-neutral-200);height:220px;}
  .s{position:relative;padding:14px;display:flex;flex-direction:column;justify-content:space-between;}
  .lbl{font-size:10px;letter-spacing:0.10em;text-transform:uppercase;font-weight:600;}
  .meta{font-family:var(--wc-font-mono);font-size:9px;opacity:0.7;margin-top:2px;}
  .chip{align-self:flex-start;font-size:11px;font-weight:500;padding:6px 10px;border-radius:8px;}

  /* light app surfaces */
  .s-app{background:#F9F9F9;color:#0E0E16;}
  .s-app .chip{background:#fff;border:1px solid #E4E4EA;color:#4A4A5C;box-shadow:0 1px 2px rgba(11,19,79,0.06);}

  .s-card{background:#fff;color:#0E0E16;border:1px solid #F1F1F4;}
  .s-card .chip{background:#F4ECFE;color:#531896;}

  .s-muted{background:#F1F1F4;color:#0E0E16;}
  .s-muted .chip{background:#fff;color:#4A4A5C;border:1px solid #E4E4EA;}

  .s-tinted{background:linear-gradient(180deg,#F4ECFE 0%,#F9F9F9 100%);color:#0E0E16;}
  .s-tinted .chip{background:#fff;color:#531896;border:1px solid #E6D3FC;}

  /* dark app surfaces */
  .s-dark{background:#0B134F;color:#fff;}
  .s-dark .chip{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.16);}

  .s-dark2{background:#080E3D;color:#fff;}
  .s-dark2 .chip{background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.10);}

  .s-glass{background:#0B134F;color:#fff;position:relative;overflow:hidden;}
  .s-glass::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(129,39,232,0.55) 1px,transparent 1.2px);background-size:14px 14px;opacity:0.7;}
  .s-glass .chip,.s-glass .lbl,.s-glass .meta{position:relative;}
  .s-glass .chip{background:rgba(255,255,255,0.08);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,0.14);}

  .s-side{background:#06092B;color:#fff;}
  .s-side .chip{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.10);}
</style></head>
<body>
  <div class="s s-app"><span class="chip">App background</span><div><div class="lbl">App BG</div><div class="meta">#F9F9F9</div></div></div>
  <div class="s s-card"><span class="chip">Surface</span><div><div class="lbl">Card</div><div class="meta">#FFFFFF</div></div></div>
  <div class="s s-muted"><span class="chip">Muted</span><div><div class="lbl">Muted Panel</div><div class="meta">#F1F1F4</div></div></div>
  <div class="s s-tinted"><span class="chip">Tinted</span><div><div class="lbl">Brand Tint</div><div class="meta">purple-50 → white</div></div></div>
  <div class="s s-dark"><span class="chip">Dark BG</span><div><div class="lbl">Dark App BG</div><div class="meta">#0B134F</div></div></div>
  <div class="s s-dark2"><span class="chip">Dark Card</span><div><div class="lbl">Elevated</div><div class="meta">#080E3D</div></div></div>
  <div class="s s-glass"><span class="chip">Glass</span><div><div class="lbl">Glass / Blur</div><div class="meta">rgba(255,255,255,0.08)</div></div></div>
  <div class="s s-side"><span class="chip">Sidebar</span><div><div class="lbl">Sidebar</div><div class="meta">#06092B</div></div></div>
</body></html>
