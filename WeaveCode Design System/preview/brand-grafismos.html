<!doctype html>
<html><head><meta charset="utf-8"><title>Brand · Grafismos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--wc-font-sans);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--wc-neutral-200);
    height: 240px;
  }
  .cell {
    position: relative;
    overflow: hidden;
    background-size: cover;
    background-position: center;
  }
  .cell .lbl {
    position: absolute; bottom: 8px; left: 10px; right: 10px;
    font-size: 10px; letter-spacing: 0.10em; text-transform: uppercase;
    color: rgba(255,255,255,0.85); font-weight: 500;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
</style></head>
<body>
  <div class="cell" style="background-image:url(../assets/grafismos/grafismo-1-glow-on-navy.png);"><span class="lbl">Glow · Navy</span></div>
  <div class="cell" style="background-image:url(../assets/grafismos/grafismo-2-glow-on-purple.png);"><span class="lbl">Glow · Purple</span></div>
  <div class="cell" style="background-image:url(../assets/grafismos/grafismo-3-orb-purple-navy.png); background-color:#0B134F;"><span class="lbl">Orb · Dark</span></div>
  <div class="cell" style="background-image:url(../assets/grafismos/grafismo-4-orb-purple-light.png);"><span class="lbl">Orb · Light</span></div>
  <div class="cell" style="background-image:url(../assets/grafismos/grafismo-5-orb-soft.png);"><span class="lbl" style="color:#4A4A5C;text-shadow:none;">Orb · Soft</span></div>
  <div class="cell" style="background-image:url(../assets/grafismos/grafismo-6-dot-pattern-navy.png);"><span class="lbl">Dots · Navy</span></div>
  <div class="cell" style="background-image:url(../assets/grafismos/grafismo-7-dot-pattern-purple.png);"><span class="lbl">Dots · Purple</span></div>
  <div class="cell" style="background:var(--wc-grad-purple-orange);"><span class="lbl">Purple → Orange</span></div>
</body></html>
