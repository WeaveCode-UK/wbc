<!doctype html>
<html><head><meta charset="utf-8"><title>Brand · Marks</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--wc-font-sans);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 1px;
    background: var(--wc-neutral-200);
    height: 220px;
  }
  .cell {
    background: var(--wc-white);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .cell img { max-width: 70%; max-height: 70%; object-fit: contain; }
  .cell .lbl {
    position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
    font-size: 10px; letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--wc-fg-3); font-weight: 500;
  }
  .cell.dot { background-color: var(--wc-deep-blue); background-image: radial-gradient(rgba(129,39,232,0.55) 1px, transparent 1.2px); background-size: 14px 14px; }
  .cell.dot .lbl, .cell.purple .lbl { color: rgba(255,255,255,0.7); }
  .cell.purple { background: var(--wc-purple); }
</style></head>
<body>
  <div class="cell">
    <img src="../assets/logos/weavecode-mark-w-braces.png" alt="W mark">
    <span class="lbl">{ W } Mark</span>
  </div>
  <div class="cell">
    <img src="../assets/logos/weavecode-square.png" alt="Square logo">
    <span class="lbl">Square Lockup</span>
  </div>
  <div class="cell purple">
    <img src="../assets/logos/weavecode-mark-w-braces.png" alt="W mark on purple" style="filter:brightness(0) invert(1);">
    <span class="lbl">On Purple</span>
  </div>
  <div class="cell dot">
    <img src="../assets/logos/weavecode-mark-w-braces.png" alt="W mark on dot pattern" style="filter:brightness(0) invert(1);">
    <span class="lbl">On Pattern</span>
  </div>
</body></html>
