<!doctype html>
<html><head><meta charset="utf-8"><title>Deep Blue Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);background:var(--wc-white);padding:20px;}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
  .step{height:120px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-family:var(--wc-font-mono);font-size:10px;}
  .step.l{color:#0B134F;}
  .step .n{font-family:var(--wc-font-sans);font-weight:600;font-size:12px;letter-spacing:0.04em;}
  h4{margin:0 0 12px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--wc-fg-3);font-weight:600;}
</style></head>
<body>
  <h4>Deep Blue — built around #0B134F (600)</h4>
  <div class="row">
    <div class="step l" style="background:#ECEDF6;"><span class="n">50</span>ECEDF6</div>
    <div class="step l" style="background:#C9CCE3;"><span class="n">100</span>C9CCE3</div>
    <div class="step l" style="background:#989DC4;"><span class="n">200</span>989DC4</div>
    <div class="step" style="background:#6770A4;"><span class="n">300</span>6770A4</div>
    <div class="step" style="background:#364285;"><span class="n">400</span>364285</div>
    <div class="step" style="background:#1B2569;"><span class="n">500</span>1B2569</div>
    <div class="step" style="background:#0B134F;"><span class="n">600</span>0B134F</div>
    <div class="step" style="background:#080E3D;"><span class="n">700</span>080E3D</div>
    <div class="step" style="background:#06092B;"><span class="n">800</span>06092B</div>
    <div class="step" style="background:#03051A;"><span class="n">900</span>03051A</div>
  </div>
</body></html>
