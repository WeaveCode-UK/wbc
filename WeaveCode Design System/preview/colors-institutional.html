<!doctype html>
<html><head><meta charset="utf-8"><title>Colors · Institutional</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--wc-neutral-200);height:220px;}
  .sw{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;}
  .sw .name{font-weight:600;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;}
  .sw .hex{font-family:var(--wc-font-mono);font-size:12px;opacity:0.85;margin-top:2px;}
  .sw .rgb{font-size:10px;opacity:0.7;margin-top:2px;}
  .light{color:var(--wc-deep-blue);border:1px solid var(--wc-neutral-200);}
</style></head>
<body>
  <div class="sw" style="background:#8127E8;"><div class="name">Roxo</div><div class="hex">#8127E8</div><div class="rgb">RGB 129·39·232</div></div>
  <div class="sw" style="background:#0B134F;"><div class="name">Azul Profundo</div><div class="hex">#0B134F</div><div class="rgb">RGB 11·19·79</div></div>
  <div class="sw" style="background:#FF6600;"><div class="name">Laranja</div><div class="hex">#FF6600</div><div class="rgb">RGB 255·102·0</div></div>
  <div class="sw light" style="background:#F9F9F9;"><div class="name">Branco</div><div class="hex">#F9F9F9</div><div class="rgb">RGB 249·249·249</div></div>
</body></html>
