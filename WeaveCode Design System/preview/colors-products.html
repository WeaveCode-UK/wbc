<!doctype html>
<html><head><meta charset="utf-8"><title>Colors · Products</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--wc-neutral-200);height:200px;}
  .sw{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:18px;color:#fff;}
  .sw .tag{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;opacity:0.85;}
  .sw .name{font-weight:600;font-size:22px;letter-spacing:-0.01em;}
  .sw .hex{font-family:var(--wc-font-mono);font-size:12px;opacity:0.85;}
</style></head>
<body>
  <div class="sw" style="background:#D161B9;"><div class="tag">Vertical</div><div><div class="name">Beauty</div><div class="hex">#D161B9</div></div></div>
  <div class="sw" style="background:#00C479;"><div class="tag">Vertical</div><div><div class="name">Health</div><div class="hex">#00C479</div></div></div>
  <div class="sw" style="background:#0030B7;"><div class="tag">Vertical</div><div><div class="name">Business</div><div class="hex">#0030B7</div></div></div>
</body></html>
