<!doctype html>
<html><head><meta charset="utf-8"><title>Purple Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);background:var(--wc-white);padding:20px;}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
  .step{height:120px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-family:var(--wc-font-mono);font-size:10px;}
  .step.l{color:#0B134F;}
  .step .n{font-family:var(--wc-font-sans);font-weight:600;font-size:12px;letter-spacing:0.04em;}
  h4{margin:0 0 12px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--wc-fg-3);font-weight:600;}
</style></head>
<body>
  <h4>Purple — built around #8127E8 (500)</h4>
  <div class="row">
    <div class="step l" style="background:#F4ECFE;"><span class="n">50</span>F4ECFE</div>
    <div class="step l" style="background:#E6D3FC;"><span class="n">100</span>E6D3FC</div>
    <div class="step l" style="background:#CDA8F8;"><span class="n">200</span>CDA8F8</div>
    <div class="step l" style="background:#B37CF4;"><span class="n">300</span>B37CF4</div>
    <div class="step" style="background:#9A50F0;"><span class="n">400</span>9A50F0</div>
    <div class="step" style="background:#8127E8;"><span class="n">500</span>8127E8</div>
    <div class="step" style="background:#6A1FBF;"><span class="n">600</span>6A1FBF</div>
    <div class="step" style="background:#531896;"><span class="n">700</span>531896</div>
    <div class="step" style="background:#3D116E;"><span class="n">800</span>3D116E</div>
    <div class="step" style="background:#260A45;"><span class="n">900</span>260A45</div>
  </div>
</body></html>
