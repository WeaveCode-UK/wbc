<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--wc-neutral-200);height:160px;}
  .sw{display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#fff;}
  .lbl{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;opacity:0.85;}
  .name{font-weight:600;font-size:18px;}
  .hex{font-family:var(--wc-font-mono);font-size:11px;opacity:0.85;}
</style></head>
<body>
  <div class="sw" style="background:#00C479;"><div class="lbl">Success</div><div><div class="name">Success</div><div class="hex">#00C479</div></div></div>
  <div class="sw" style="background:#FF6600;"><div class="lbl">Warning</div><div><div class="name">Warning</div><div class="hex">#FF6600</div></div></div>
  <div class="sw" style="background:#E5484D;"><div class="lbl">Error</div><div><div class="name">Error</div><div class="hex">#E5484D</div></div></div>
  <div class="sw" style="background:#0030B7;"><div class="lbl">Info</div><div><div class="name">Info</div><div class="hex">#0030B7</div></div></div>
</body></html>
