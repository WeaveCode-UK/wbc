<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);background:var(--wc-white);padding:24px 28px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .btn{font-family:var(--wc-font-sans);font-weight:500;font-size:14px;padding:10px 18px;border-radius:8px;border:none;cursor:pointer;transition:all 180ms cubic-bezier(.22,1,.36,1);display:inline-flex;align-items:center;gap:8px;}
  .btn-primary{background:#8127E8;color:#fff;}
  .btn-primary:hover{background:#6A1FBF;}
  .btn-secondary{background:#0B134F;color:#fff;}
  .btn-outline{background:#fff;color:#8127E8;border:1.5px solid #8127E8;}
  .btn-ghost{background:transparent;color:#8127E8;}
  .btn-ghost:hover{background:#F4ECFE;}
  .btn-orange{background:#FF6600;color:#fff;}
  .btn-destructive{background:#E5484D;color:#fff;}
  .btn-disabled{background:var(--wc-neutral-200);color:var(--wc-neutral-400);cursor:not-allowed;}
  .btn-sm{font-size:12px;padding:7px 12px;border-radius:6px;}
  .btn-lg{font-size:16px;padding:14px 24px;border-radius:10px;}
  .lbl{font-size:10px;letter-spacing:0.10em;text-transform:uppercase;color:var(--wc-fg-3);font-weight:600;width:80px;}
</style></head>
<body>
  <div class="row"><span class="lbl">Variants</span>
    <button class="btn btn-primary">Primary →</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-outline">Outline</button>
    <button class="btn btn-ghost">Ghost</button>
    <button class="btn btn-orange">Accent</button>
    <button class="btn btn-destructive">Delete</button>
    <button class="btn btn-disabled">Disabled</button>
  </div>
  <div class="row"><span class="lbl">Sizes</span>
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-lg">Large</button>
  </div>
</body></html>
