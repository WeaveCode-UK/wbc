<!doctype html>
<html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);background:var(--wc-neutral-50);padding:24px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
  .card{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--wc-shadow-md);display:flex;flex-direction:column;gap:8px;}
  .eyebrow{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;color:var(--wc-fg-3);}
  .title{font-size:18px;font-weight:600;letter-spacing:-0.01em;color:var(--wc-fg-1);}
  .body{font-size:13px;line-height:1.5;font-weight:300;color:var(--wc-fg-2);}
  .stat{font-size:36px;font-weight:600;letter-spacing:-0.02em;color:var(--wc-purple);line-height:1;}
  .card.brand{background:var(--wc-deep-blue);color:#fff;background-image:radial-gradient(rgba(129,39,232,0.55) 1px,transparent 1.2px);background-size:14px 14px;}
  .card.brand .eyebrow{color:rgba(255,255,255,0.55);}
  .card.brand .title{color:#fff;}
  .card.brand .body{color:rgba(255,255,255,0.7);}
  .pill{align-self:flex-start;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--wc-purple-50);color:var(--wc-purple-700);}
</style></head>
<body>
  <div class="card">
    <span class="pill">Stat</span>
    <div class="stat">147</div>
    <div class="body">Projects shipped this year.</div>
  </div>
  <div class="card">
    <div class="eyebrow">Service</div>
    <div class="title">Bespoke product engineering</div>
    <div class="body">Small teams, sewn around your problem. Designed, built, deployed.</div>
  </div>
  <div class="card brand">
    <div class="eyebrow">Highlight</div>
    <div class="title" style="font-family:var(--wc-font-serif);font-style:italic;font-weight:400;">{ craft }</div>
    <div class="body">The Georgia italic moment, used as a single visual accent.</div>
  </div>
</body></html>
