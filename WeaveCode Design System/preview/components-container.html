<!doctype html>
<html><head><meta charset="utf-8"><title>Container</title><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;}body{font-family:var(--wc-font-sans);background:#F9F9F9;padding:20px;color:#0E0E16;}
.cap{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;color:#6E6E83;margin-bottom:8px;}
.cont{background:#fff;border:1px dashed #C9C9D3;border-radius:12px;padding:14px;margin-bottom:14px;position:relative;}
.cont::after{content:attr(data-w);position:absolute;top:6px;right:10px;font-family:var(--wc-font-mono);font-size:10px;color:#9C9CAE;}
.bar{height:14px;background:linear-gradient(90deg,#8127E8 0%,#B37CF4 100%);border-radius:4px;}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;}
.col{background:#F4ECFE;border:1px solid #CDA8F8;border-radius:4px;height:32px;display:flex;align-items:center;justify-content:center;font-family:var(--wc-font-mono);font-size:10px;color:#531896;}</style></head>
<body>
<div class="cap">Container · max-widths</div>
<div class="cont" data-w="sm · 640" style="max-width:640px;"><div class="bar"></div></div>
<div class="cont" data-w="md · 960" style="max-width:960px;"><div class="bar"></div></div>
<div class="cont" data-w="lg · 1200" style="max-width:1200px;"><div class="bar"></div></div>

<div class="cap" style="margin-top:18px;">12-column grid</div>
<div class="grid12">
  <div class="col" style="grid-column:span 12;">12</div>
</div>
<div class="grid12" style="margin-top:6px;">
  <div class="col" style="grid-column:span 8;">8</div>
  <div class="col" style="grid-column:span 4;">4</div>
</div>
<div class="grid12" style="margin-top:6px;">
  <div class="col" style="grid-column:span 4;">4</div>
  <div class="col" style="grid-column:span 4;">4</div>
  <div class="col" style="grid-column:span 4;">4</div>
</div>
</body></html>
