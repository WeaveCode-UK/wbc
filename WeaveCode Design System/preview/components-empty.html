<!doctype html>
<html><head><meta charset="utf-8"><title>Empty State</title><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;}body{font-family:var(--wc-font-sans);background:#F9F9F9;padding:30px;display:flex;align-items:center;justify-content:center;min-height:240px;}
.e{background:#fff;border:1px dashed #C9C9D3;border-radius:18px;padding:36px;text-align:center;max-width:480px;width:100%;display:flex;flex-direction:column;gap:8px;align-items:center;}
.glyph{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#F4ECFE,#E6D3FC);display:flex;align-items:center;justify-content:center;color:#8127E8;font-family:Georgia,serif;font-style:italic;font-size:28px;font-weight:400;margin-bottom:6px;}
h3{margin:0;font-size:18px;font-weight:600;color:#0E0E16;letter-spacing:-0.01em;}
p{margin:0;font-size:14px;line-height:1.55;color:#4A4A5C;font-weight:300;max-width:320px;}
.cta{margin-top:14px;background:#8127E8;color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;}</style></head>
<body>
<div class="e">
  <div class="glyph">{ }</div>
  <h3>No projects yet</h3>
  <p>Start your first project to see it here. We'll help you set it up step by step.</p>
  <button class="cta">Create project →</button>
</div>
</body></html>
