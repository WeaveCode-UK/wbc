<!doctype html>
<html><head><meta charset="utf-8"><title>Brand Hero</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);background:var(--wc-deep-blue);background-image:radial-gradient(rgba(129,39,232,0.55) 1px,transparent 1.2px);background-size:14px 14px;height:280px;position:relative;overflow:hidden;color:#fff;}
  .glow{position:absolute;top:-30%;left:-15%;width:70%;height:160%;background:radial-gradient(ellipse at center,rgba(129,39,232,0.85) 0%,rgba(129,39,232,0.3) 35%,transparent 70%);filter:blur(20px);}
  .content{position:relative;z-index:2;padding:36px 40px;max-width:560px;}
  .eyebrow{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,0.65);}
  h1{margin:14px 0 10px;font-size:42px;font-weight:600;line-height:1.05;letter-spacing:-0.02em;}
  h1 .it{font-family:var(--wc-font-serif);font-style:italic;font-weight:400;color:#CDA8F8;}
  p{margin:0 0 18px;font-size:14px;font-weight:300;line-height:1.55;color:rgba(255,255,255,0.78);max-width:420px;}
  .cta{display:inline-flex;align-items:center;gap:8px;background:#FF6600;color:#fff;border:none;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;}
</style></head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="eyebrow">Studio · 2026</div>
    <h1>Software, <span class="it">{sewn to fit}</span>.</h1>
    <p>We build what your team would build, if they had the time. Bespoke product engineering, woven around your problem.</p>
    <button class="cta">Get in touch →</button>
  </div>
</body></html>
