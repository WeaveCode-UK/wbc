<!doctype html>
<html><head><meta charset="utf-8"><title>Form Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);background:var(--wc-white);padding:24px 28px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  label{display:block;font-size:12px;font-weight:500;color:var(--wc-fg-2);margin-bottom:6px;}
  .input{width:100%;box-sizing:border-box;font-family:var(--wc-font-sans);font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--wc-neutral-200);background:#fff;color:var(--wc-fg-1);outline:none;transition:all 180ms;}
  .input:focus{border-color:#8127E8;box-shadow:0 0 0 3px rgba(129,39,232,0.18);}
  .input.err{border-color:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,0.15);}
  .help{font-size:11px;color:var(--wc-fg-3);margin-top:4px;}
  .help.err{color:#E5484D;}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--wc-fg-1);}
  .check input{accent-color:#8127E8;width:16px;height:16px;}
  .switch{width:38px;height:22px;background:#8127E8;border-radius:999px;position:relative;cursor:pointer;}
  .switch::after{content:'';position:absolute;top:2px;left:18px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
</style></head>
<body>
  <div>
    <label>Email</label>
    <input class="input" value="founder@weavecode.co.uk" />
    <div class="help">We'll never share this address.</div>
  </div>
  <div>
    <label>Password</label>
    <input class="input err" type="password" value="••••" />
    <div class="help err">At least 8 characters required.</div>
  </div>
  <div>
    <label>Project type</label>
    <select class="input"><option>Beauty</option><option>Health</option><option>Business</option></select>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;justify-content:end;">
    <div class="check"><input type="checkbox" checked /> Subscribe to updates</div>
    <div class="check"><input type="radio" name="r" checked /> Monthly</div>
    <div class="check"><div class="switch"></div> Notifications on</div>
  </div>
</body></html>
