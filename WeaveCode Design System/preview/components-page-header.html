<!doctype html>
<html><head><meta charset="utf-8"><title>Page Header</title><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;}body{font-family:var(--wc-font-sans);background:#F9F9F9;padding:24px;}
.crumb{font-size:12px;color:#6E6E83;display:flex;gap:6px;}
.crumb a{color:#6E6E83;text-decoration:none;}.crumb b{color:#0E0E16;font-weight:500;}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-top:8px;}
h1{margin:0;font-size:32px;font-weight:600;letter-spacing:-0.02em;color:#0E0E16;}
.sub{font-size:14px;color:#4A4A5C;font-weight:300;margin-top:6px;max-width:520px;line-height:1.5;}
.actions{display:flex;gap:8px;flex-shrink:0;margin-top:6px;}
.btn{font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-weight:500;}
.btn-p{background:#8127E8;color:#fff;}
.btn-o{background:#fff;color:#0E0E16;border-color:#E4E4EA;}
.tabs{display:flex;gap:4px;border-bottom:1px solid #E4E4EA;margin-top:24px;}
.tab{font-size:13px;font-weight:500;padding:10px 14px;color:#6E6E83;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:#8127E8;border-bottom-color:#8127E8;}
.b{display:inline-block;background:#F4ECFE;color:#531896;font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;margin-left:6px;}</style></head>
<body>
<div class="crumb"><a>Workspace</a><span>/</span><a>Projects</a><span>/</span><b>Acme rebrand</b></div>
<div class="row">
  <div><h1>Acme rebrand</h1><div class="sub">A complete redesign of Acme's customer-facing booking flow. Sewn around the salon experience, not generic templates.</div></div>
  <div class="actions"><button class="btn btn-o">Export</button><button class="btn btn-p">+ New task</button></div>
</div>
<div class="tabs">
  <div class="tab active">Overview</div>
  <div class="tab">Tasks<span class="b">12</span></div>
  <div class="tab">Files</div>
  <div class="tab">Activity</div>
</div>
</body></html>
