<!doctype html>
<html><head><meta charset="utf-8"><title>Pagination</title><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;}body{font-family:var(--wc-font-sans);background:#fff;padding:24px;display:flex;flex-direction:column;gap:24px;color:#0E0E16;}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.meta{font-size:12px;color:#6E6E83;font-weight:300;}
.meta b{color:#0E0E16;font-weight:500;}
.pag{display:flex;gap:4px;}
.pg{min-width:32px;height:32px;border-radius:8px;border:1px solid #E4E4EA;background:#fff;font-size:13px;font-weight:500;color:#4A4A5C;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;}
.pg.active{background:#8127E8;color:#fff;border-color:#8127E8;}
.pg:hover:not(.active):not(.disabled){background:#F4ECFE;color:#531896;border-color:#E6D3FC;}
.pg.disabled{color:#C9C9D3;cursor:not-allowed;}
.pg.dots{border:none;cursor:default;}

.sel{font-family:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid #E4E4EA;background:#fff;}
.cap{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;color:#6E6E83;}</style></head>
<body>
<div>
  <div class="cap" style="margin-bottom:10px;">Full pagination</div>
  <div class="row">
    <div class="meta">Showing <b>1–10</b> of <b>248</b> projects</div>
    <div class="pag">
      <button class="pg disabled">←</button>
      <button class="pg active">1</button>
      <button class="pg">2</button>
      <button class="pg">3</button>
      <button class="pg dots">…</button>
      <button class="pg">25</button>
      <button class="pg">→</button>
    </div>
    <div class="meta">Rows: <select class="sel"><option>10</option><option>25</option><option>50</option></select></div>
  </div>
</div>

<div>
  <div class="cap" style="margin-bottom:10px;">Compact</div>
  <div class="pag">
    <button class="pg">← Previous</button>
    <button class="pg">Next →</button>
  </div>
</div>
</body></html>
