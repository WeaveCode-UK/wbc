<!doctype html>
<html><head><meta charset="utf-8"><title>App Shell</title><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;height:100%;}body{font-family:var(--wc-font-sans);background:#F9F9F9;height:100%;display:grid;grid-template-columns:220px 1fr;}
aside{background:#06092B;color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:6px;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:10px;}
.brand img{height:24px;filter:brightness(0) invert(1);}
.brand .name{font-weight:600;font-size:15px;}
.cap{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,0.4);padding:10px 8px 4px;}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:rgba(255,255,255,0.78);cursor:pointer;font-weight:400;}
.nav:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav.active{background:#8127E8;color:#fff;font-weight:500;box-shadow:0 4px 12px rgba(129,39,232,0.4);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0.55;}
.nav.active .dot{opacity:1;}
.user{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,0.08);font-size:12px;color:rgba(255,255,255,0.7);display:flex;gap:10px;align-items:center;}
.av{width:30px;height:30px;border-radius:50%;background:#8127E8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;}

main{display:flex;flex-direction:column;min-width:0;}
.topbar{height:56px;background:#fff;border-bottom:1px solid #E4E4EA;display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.crumb{font-size:13px;color:#6E6E83;}
.crumb b{color:#0E0E16;font-weight:500;}
.search{background:#F1F1F4;border:none;border-radius:8px;padding:7px 12px;font-size:13px;width:240px;font-family:inherit;}
.t-actions{display:flex;align-items:center;gap:10px;}
.bell{width:32px;height:32px;border-radius:8px;background:#F1F1F4;display:flex;align-items:center;justify-content:center;color:#4A4A5C;font-size:14px;}

.content{padding:20px;color:#0E0E16;}
h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em;}
.sub{font-size:13px;color:#6E6E83;font-weight:300;margin-top:4px;}</style></head>
<body>
<aside>
  <div class="brand"><img src="../assets/logos/weavecode-mark-w-braces.png"/><span class="name">weavecode</span></div>
  <div class="cap">Workspace</div>
  <div class="nav active"><span class="dot"></span>Dashboard</div>
  <div class="nav"><span class="dot"></span>Projects</div>
  <div class="nav"><span class="dot"></span>Clients</div>
  <div class="nav"><span class="dot"></span>Activity</div>
  <div class="cap">Verticals</div>
  <div class="nav"><span class="dot" style="background:#D161B9;opacity:1;"></span>Beauty</div>
  <div class="nav"><span class="dot" style="background:#00C479;opacity:1;"></span>Health</div>
  <div class="nav"><span class="dot" style="background:#0030B7;opacity:1;"></span>Business</div>
  <div class="user"><div class="av">JS</div><div><div style="color:#fff;font-weight:500;">Júlio S.</div><div style="font-size:10px;">Admin</div></div></div>
</aside>
<main>
  <div class="topbar">
    <div class="crumb">Workspace · <b>Dashboard</b></div>
    <input class="search" placeholder="Search projects, clients…"/>
    <div class="t-actions"><div class="bell">⌘K</div><div class="bell">🔔</div></div>
  </div>
  <div class="content"><h2>Good morning, Júlio.</h2><div class="sub">Here's what's woven this week.</div></div>
</main>
</body></html>
