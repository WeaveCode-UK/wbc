<!doctype html>
<html><head><meta charset="utf-8"><title>Table</title><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;}body{font-family:var(--wc-font-sans);background:#F9F9F9;padding:18px;font-size:13px;color:#0E0E16;}
.tbl{background:#fff;border-radius:14px;border:1px solid #E4E4EA;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:#6E6E83;padding:10px 14px;border-bottom:1px solid #F1F1F4;background:#F9F9F9;}
td{padding:11px 14px;border-bottom:1px solid #F1F1F4;font-weight:300;color:#0E0E16;}
tr:last-child td{border-bottom:0;}
tr:hover td{background:#FAFAFE;}
tr.sel td{background:#F4ECFE;}
.b{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:0.04em;}
.b-beauty{background:#F8DCEF;color:#7A2A66;}.b-health{background:#CFF5E3;color:#005C39;}.b-biz{background:#D6DEF6;color:#001F75;}
.s{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;}
.dot{width:7px;height:7px;border-radius:50%;}
.r{text-align:right;font-family:var(--wc-font-mono);}
.av{width:24px;height:24px;border-radius:50%;background:#8127E8;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;margin-right:8px;vertical-align:middle;}
input[type=checkbox]{accent-color:#8127E8;}
.actions{color:#9C9CAE;}</style></head>
<body>
<div class="tbl">
<table>
<thead><tr><th style="width:30px;"><input type="checkbox"/></th><th>Project</th><th>Vertical</th><th>Status</th><th class="r">Budget</th><th></th></tr></thead>
<tbody>
<tr class="sel"><td><input type="checkbox" checked/></td><td><span class="av">A</span>Acme rebrand</td><td><span class="b b-beauty">Beauty</span></td><td><span class="s"><span class="dot" style="background:#00C479;"></span>Shipped</span></td><td class="r">£42,000</td><td class="actions">⋯</td></tr>
<tr><td><input type="checkbox"/></td><td><span class="av">N</span>Nimbus clinic OS</td><td><span class="b b-health">Health</span></td><td><span class="s"><span class="dot" style="background:#8127E8;"></span>Active</span></td><td class="r">£128,500</td><td class="actions">⋯</td></tr>
<tr><td><input type="checkbox"/></td><td><span class="av">Q</span>Quill ops dashboard</td><td><span class="b b-biz">Business</span></td><td><span class="s"><span class="dot" style="background:#FF6600;"></span>In review</span></td><td class="r">£64,200</td><td class="actions">⋯</td></tr>
<tr><td><input type="checkbox"/></td><td><span class="av">L</span>Luma booking</td><td><span class="b b-beauty">Beauty</span></td><td><span class="s"><span class="dot" style="background:#9C9CAE;"></span>Draft</span></td><td class="r">—</td><td class="actions">⋯</td></tr>
</tbody>
</table>
</div>
</body></html>
