<!doctype html>
<html><head><meta charset="utf-8"><title>Toast</title><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0}body{font-family:var(--wc-font-sans);background:#0B134F;background-image:radial-gradient(rgba(129,39,232,0.55) 1px,transparent 1.2px);background-size:14px 14px;padding:24px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.t{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:12px;padding:11px 14px;box-shadow:0 16px 36px rgba(11,19,79,0.30);min-width:320px;max-width:380px;}
.ic{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.ttl{font-size:13px;font-weight:600;color:#0E0E16;}.msg{font-size:12px;color:#4A4A5C;margin-top:2px;font-weight:300;line-height:1.45;}
.x{margin-left:auto;background:none;border:none;color:#9C9CAE;cursor:pointer;font-size:14px;padding:0;}
.dark{background:#06092B;border:1px solid rgba(255,255,255,0.10);}.dark .ttl{color:#fff;}.dark .msg{color:rgba(255,255,255,0.7);}</style></head>
<body>
  <div class="t"><span class="ic" style="background:#00C479;"></span><div><div class="ttl">Project created.</div><div class="msg">Acme rebrand is now in your dashboard.</div></div><button class="x">✕</button></div>
  <div class="t"><span class="ic" style="background:#E5484D;"></span><div><div class="ttl">We couldn't save your changes.</div><div class="msg">Check your connection and try again.</div></div><button class="x">✕</button></div>
  <div class="t dark"><span class="ic" style="background:#8127E8;"></span><div><div class="ttl">Heads up</div><div class="msg">Maintenance scheduled for Sunday 02:00 UTC.</div></div><button class="x" style="color:rgba(255,255,255,0.5);">✕</button></div>
</body></html>
