<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);background:var(--wc-white);padding:22px 28px;color:var(--wc-fg-1);}
  .row{display:flex;align-items:center;gap:14px;padding:5px 0;}
  .lbl{font-family:var(--wc-font-mono);font-size:11px;color:var(--wc-fg-3);width:60px;}
  .px{font-family:var(--wc-font-mono);font-size:11px;color:var(--wc-fg-3);width:48px;text-align:right;}
  .bar{background:var(--wc-purple);height:14px;border-radius:3px;}
  h4{margin:0 0 10px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--wc-fg-3);font-weight:600;}
</style></head>
<body>
  <h4>Spacing — 4px grid</h4>
  <div class="row"><span class="lbl">space-1</span><div class="bar" style="width:4px;"></div><span class="px">4px</span></div>
  <div class="row"><span class="lbl">space-2</span><div class="bar" style="width:8px;"></div><span class="px">8px</span></div>
  <div class="row"><span class="lbl">space-3</span><div class="bar" style="width:12px;"></div><span class="px">12px</span></div>
  <div class="row"><span class="lbl">space-4</span><div class="bar" style="width:16px;"></div><span class="px">16px</span></div>
  <div class="row"><span class="lbl">space-5</span><div class="bar" style="width:24px;"></div><span class="px">24px</span></div>
  <div class="row"><span class="lbl">space-6</span><div class="bar" style="width:32px;"></div><span class="px">32px</span></div>
  <div class="row"><span class="lbl">space-7</span><div class="bar" style="width:48px;"></div><span class="px">48px</span></div>
  <div class="row"><span class="lbl">space-8</span><div class="bar" style="width:64px;"></div><span class="px">64px</span></div>
  <div class="row"><span class="lbl">space-9</span><div class="bar" style="width:96px;"></div><span class="px">96px</span></div>
</body></html>
