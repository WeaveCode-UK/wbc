<!doctype html>
<html><head><meta charset="utf-8"><title>Display Moment</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);background:var(--wc-deep-blue);background-image:radial-gradient(rgba(129,39,232,0.55) 1px,transparent 1.2px);background-size:14px 14px;color:#fff;display:flex;align-items:center;justify-content:center;height:280px;padding:20px;text-align:center;}
  h1{margin:0;font-weight:600;font-size:54px;line-height:1.05;letter-spacing:-0.02em;}
  h1 .acc{font-family:var(--wc-font-serif);font-style:italic;font-weight:400;color:#CDA8F8;}
  p{margin:14px 0 0;font-size:15px;line-height:1.55;font-weight:300;opacity:0.78;max-width:520px;}
</style></head>
<body>
  <div>
    <h1>Software, <span class="acc">{sewn to fit}</span>.</h1>
    <p>The Georgia italic moment — used once per surface to echo <span style="font-family:var(--wc-font-serif);font-style:italic;">{code}</span> in the wordmark.</p>
  </div>
</body></html>
