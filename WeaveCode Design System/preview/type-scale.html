<!doctype html>
<html><head><meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  body{font-family:var(--wc-font-sans);background:var(--wc-white);padding:24px 32px;color:var(--wc-fg-1);}
  .row{display:grid;grid-template-columns:90px 1fr 90px;gap:18px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--wc-neutral-100);}
  .row:last-child{border-bottom:0;}
  .lbl{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--wc-fg-3);font-weight:600;}
  .meta{font-size:11px;color:var(--wc-fg-3);font-family:var(--wc-font-mono);text-align:right;}
</style></head>
<body>
  <div class="row"><span class="lbl">H1</span><span style="font-size:36px;line-height:1.1;font-weight:600;letter-spacing:-0.02em;">Software, sewn to fit.</span><span class="meta">48 / 600</span></div>
  <div class="row"><span class="lbl">H2</span><span style="font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-0.02em;">Costuramos código.</span><span class="meta">36 / 600</span></div>
  <div class="row"><span class="lbl">H3</span><span style="font-size:22px;line-height:1.2;font-weight:500;">Built for craft.</span><span class="meta">28 / 500</span></div>
  <div class="row"><span class="lbl">Body</span><span style="font-size:16px;line-height:1.5;font-weight:300;color:var(--wc-fg-2);">We build what your team would build, if they had the time.</span><span class="meta">16 / 300</span></div>
  <div class="row"><span class="lbl">Caption</span><span style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;color:var(--wc-fg-3);">Eyebrow label</span><span class="meta">12 / 500</span></div>
</body></html>
