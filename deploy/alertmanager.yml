# ACH-006 observabilidade-operacao: Alertmanager config template.
# Substituir placeholders antes de subir (webhooks via secrets).

global:
  resolve_timeout: 5m
  # Slack webhook é lido de SLACK_WEBHOOK_URL no ambiente do alertmanager
  # (montado via env_file ou secret); o default abaixo é só para
  # documentar o formato esperado.
  # slack_api_url: "${SLACK_WEBHOOK_URL}"

route:
  receiver: "slack-default"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - severity = critical
      receiver: "pagerduty-critical"
      continue: true
    - matchers:
        - severity = warning
      receiver: "slack-default"

receivers:
  - name: "slack-default"
    slack_configs:
      - channel: "#wbc-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}

  - name: "pagerduty-critical"
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ["alertname", "job"]
