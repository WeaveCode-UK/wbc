groups:
  - name: wbc-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(wbc_domain_errors_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High domain error rate (> 0.5/s for 2m)"

      - alert: SlowRequests
        expr: histogram_quantile(0.95, rate(wbc_trpc_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 request latency above 2s for 5m"

      - alert: HighRequestRate
        expr: rate(wbc_trpc_requests_total[1m]) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Request rate above 100/s sustained for 5m"

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
