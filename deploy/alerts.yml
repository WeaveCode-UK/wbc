groups:
  - name: wbc-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(wbc_domain_errors_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High domain error rate (> 0.5/s for 2m)"

      - alert: SlowRequests
        expr: histogram_quantile(0.95, rate(wbc_trpc_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 request latency above 2s for 5m"

      - alert: HighRequestRate
        expr: rate(wbc_trpc_requests_total[1m]) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Request rate above 100/s sustained for 5m"

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          runbook_url: "https://github.com/WeaveCode-UK/wbc/blob/main/docs/runbooks/target-down.md"

      # ACH-004 observabilidade-operacao: DLQ monitoring.
      - alert: DLQEventsGrowing
        expr: increase(wbc_dlq_events_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 10 events migrated to DLQ in 5m ({{ $labels.queue }})"
          runbook_url: "https://github.com/WeaveCode-UK/wbc/blob/main/docs/runbooks/dlq-growing.md"

      # ACH-001/ACH-005 observabilidade-operacao: outbox lag (via worker metric).
      - alert: OutboxLagHigh
        expr: wbc_outbox_lag_ms > 60000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Outbox lag > 60s for 3m — worker is falling behind"
          runbook_url: "https://github.com/WeaveCode-UK/wbc/blob/main/docs/runbooks/outbox-lag.md"

      - alert: BullMQQueueDepthHigh
        expr: wbc_bullmq_queue_depth{state="waiting"} > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} waiting > 1000 for 5m"
          runbook_url: "https://github.com/WeaveCode-UK/wbc/blob/main/docs/runbooks/queue-depth.md"

  # ──────────────────────────────────────────────────────────────
  # ACH-004 custos-finops: regras de FinOps.
  # Placeholders: as métricas wbc_tenant_cost_* ainda não existem no código.
  # Elas serão emitidas após a implementação de ACH-001 (CostBudgetService)
  # e ACH-003 (MessageBilling). Até lá, estas regras não disparam (métricas
  # ausentes = expressão vazia = silêncio). Quando as métricas existirem,
  # os alertas passam a funcionar sem mais nenhuma mudança em alerts.yml.
  # Ver docs/FINOPS-OBSERVABILITY.md.
  # ──────────────────────────────────────────────────────────────
  - name: wbc-finops-alerts
    rules:
      - alert: TenantBudget80PctReached
        expr: |
          (wbc_tenant_monthly_cost_usd / wbc_tenant_monthly_cost_budget_usd) > 0.8
          and
          (wbc_tenant_monthly_cost_usd / wbc_tenant_monthly_cost_budget_usd) < 1.0
        for: 10m
        labels:
          severity: warning
          category: finops
        annotations:
          summary: "Tenant {{ $labels.tenant }} atingiu 80% do budget ({{ $labels.provider }})"
          runbook_url: "https://github.com/WeaveCode-UK/wbc/blob/main/docs/FINOPS-KILL-SWITCH.md"

      - alert: TenantBudgetExhausted
        expr: wbc_tenant_monthly_cost_usd >= wbc_tenant_monthly_cost_budget_usd
        for: 5m
        labels:
          severity: critical
          category: finops
        annotations:
          summary: "Tenant {{ $labels.tenant }} esgotou budget de {{ $labels.provider }}"
          runbook_url: "https://github.com/WeaveCode-UK/wbc/blob/main/docs/FINOPS-KILL-SWITCH.md"

      - alert: GlobalCostSpike
        expr: sum(increase(wbc_tenant_cost_usd_total[1h])) > sum(increase(wbc_tenant_cost_usd_total[1h] offset 24h)) * 2
        for: 30m
        labels:
          severity: warning
          category: finops
        annotations:
          summary: "Custo global nas últimas 1h > 2x o mesmo período de ontem"
          runbook_url: "https://github.com/WeaveCode-UK/wbc/blob/main/docs/FINOPS-OBSERVABILITY.md"

      - alert: ReconciliationDivergence
        expr: wbc_reconciliation_diff_abs_pct > 0.05
        for: 0m
        labels:
          severity: warning
          category: finops
        annotations:
          summary: "Divergência > 5% entre snapshot e fatura ({{ $labels.provider }} / {{ $labels.period }})"
          runbook_url: "https://github.com/WeaveCode-UK/wbc/blob/main/docs/FINOPS-COST-RECONCILIATION.md"
