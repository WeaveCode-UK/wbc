# ACH-014 observabilidade-operacao: log estruturado JSON.
# Consumido por log aggregator (Filebeat/Promtail) e/ou
# nginx-prometheus-exporter. Inclui latência upstream e request time
# para diagnóstico de latência de borda.
log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"scheme":"$scheme",'
        '"server_name":"$server_name"'
    '}';

access_log /var/log/nginx/access.json json_combined;
error_log /var/log/nginx/error.log warn;

upstream web {
    server web:3000;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip (ACH-021 performance-escalabilidade)
    # - `gzip_comp_level 6` is the sweet spot (~70% of max ratio at
    #   ~20% of CPU vs level 9); default (1) barely compresses.
    # - `gzip_min_length 500` — bundles/CSS often clear 500 B even
    #   minified; the old 1000 skipped a lot of chunks.
    # - `gzip_vary` signals CDNs to cache compressed/uncompressed
    #   separately.
    # - `gzip_proxied any` keeps compression on behind a CDN/proxy.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 500;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # Brotli (ACH-021, opt-in)
    # Requires `ngx_brotli` module compiled into nginx. Uncomment once
    # the base image includes it; keep gzip on as fallback for clients
    # that don't advertise `br` in Accept-Encoding.
    # brotli on;
    # brotli_comp_level 4;
    # brotli_min_length 500;
    # brotli_types
    #     text/plain text/css text/xml application/json
    #     application/javascript application/xml image/svg+xml
    #     font/woff font/woff2;

    # Max upload size
    client_max_body_size 10M;

    # Next.js app
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets — long cache
    location /_next/static/ {
        proxy_pass http://web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Grafana dashboards (admin only)
    location /grafana/ {
        proxy_pass http://grafana:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
