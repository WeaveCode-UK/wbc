services:
  # ── Database ────────────────────────────────────────────────
  postgres:
    # ACH-004 supply-chain-dependencias: pin por digest. Tag postgres:16-alpine em 2026-04-23.
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: wbc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wbc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wbc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wbc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # ACH-026: drop ambient capabilities; Postgres only needs default ones.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ── Cache / Queue ───────────────────────────────────────────
  redis:
    # ACH-004 supply-chain-dependencias: pin por digest. Tag redis:7-alpine em 2026-04-23.
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: wbc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ── Web (Next.js) ───────────────────────────────────���───────
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-wbc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wbc}?schema=public
    container_name: wbc-web
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wbc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wbc}?schema=public&connection_limit=20&pool_timeout=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness check via tRPC endpoint. Next.js serve em 3000.
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/trpc/health.live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal
    # ACH-026: read-only rootfs + tmpfs for Next.js cache; drop all caps;
    # block privilege escalation.
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /app/.next/cache:size=256m,uid=1001,gid=1001
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

  # ── Worker (BullMQ) ─────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-wbc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wbc}?schema=public
    container_name: wbc-worker
    restart: unless-stopped
    # ACH-005 confiabilidade-resiliencia: o worker implementa shutdown
    # longo (até 30s) para drenar jobs em-flight. Default do Docker é
    # 10s, o que gera SIGKILL prematuro e deixa eventos em PROCESSING
    # órfãos. 40s dá margem para drenar antes do kill forçado.
    stop_grace_period: 40s
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wbc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wbc}?schema=public&connection_limit=5&pool_timeout=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Health server do worker em porta dedicada (ACH-011).
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9100/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ── Nginx (reverse proxy + SSL) ─────────────────────────────
  nginx:
    # ACH-004 supply-chain-dependencias: pin por digest. Tag nginx:alpine em 2026-04-23.
    image: nginx:alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: wbc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      # ACH-014 observabilidade-operacao: volume para logs estruturados.
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - internal
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

  # ── Certbot (SSL auto-renewal) ──────────────────────────────
  certbot:
    # ACH-004 supply-chain-dependencias: pin por digest. Tag certbot/certbot:latest em 2026-04-23.
    image: certbot/certbot:latest@sha256:78a7eaa40af657301e25731297b6e73646c695370d17e9bb03189fa82966d65c
    container_name: wbc-certbot
    volumes:
      - ssl_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - internal

  # ── Prometheus (metrics collection) ──────────────────────────
  prometheus:
    # ACH-004 supply-chain-dependencias: pin por digest. Tag prom/prometheus:v2.54.1 em 2026-04-23.
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    container_name: wbc-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=30d --web.enable-lifecycle
    networks:
      - internal
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ── Alertmanager (routing de alertas) ───────────────────────
  # ACH-006 observabilidade-operacao: expõe canal real para as regras
  # definidas em deploy/alerts.yml. Sem alertmanager os alertas
  # disparavam sem destino.
  alertmanager:
    # ACH-004 supply-chain-dependencias: pin por digest. Tag prom/alertmanager:v0.27.0 em 2026-04-23.
    image: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    container_name: wbc-alertmanager
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    networks:
      - internal
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ── Grafana (dashboards) ────────────────────────────────────
  grafana:
    # ACH-004 supply-chain-dependencias: pin por digest. Tag grafana/grafana:11.2.2 em 2026-04-23.
    image: grafana/grafana:11.2.2@sha256:d5133220d770aba5cb655147b619fa8770b90f41d8489a821d33b1cd34d16f89
    container_name: wbc-grafana
    restart: unless-stopped
    environment:
      # ACH-014: GRAFANA_PASSWORD must be set in .env.production. The previous
      # `:-admin` fallback let Grafana boot with the default admin/admin
      # credential whenever the env var was missing.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required and must not be empty}
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      # ACH-008 observabilidade-operacao: provisioning declarativo.
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - internal
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  ssl_certs:
  certbot_www:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  nginx_logs:

networks:
  internal:
    driver: bridge
