services:
  # ── Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wbc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wbc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wbc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wbc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Cache / Queue ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wbc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Web (Next.js) ───────────────────────────────────���───────
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-wbc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wbc}?schema=public
    container_name: wbc-web
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wbc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wbc}?schema=public&connection_limit=20&pool_timeout=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Worker (BullMQ) ─────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-wbc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wbc}?schema=public
    container_name: wbc-worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wbc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wbc}?schema=public&connection_limit=5&pool_timeout=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Nginx (reverse proxy + SSL) ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: wbc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - internal

  # ── Certbot (SSL auto-renewal) ──────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: wbc-certbot
    volumes:
      - ssl_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - internal

  # ── Prometheus (metrics collection) ──────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: wbc-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=30d
    networks:
      - internal

  # ── Grafana (dashboards) ────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: wbc-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  ssl_certs:
  certbot_www:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
